name = "hlt-booking-forms"
main = "forms-worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [
  { pattern = "hoangluxury.travel/api/forms", zone_name = "hoangluxury.travel" },
  { pattern = "www.hoangluxury.travel/api/forms", zone_name = "hoangluxury.travel" }
]

[vars]
# Giữ khớp với Cloudflare Dashboard: mỗi lần `wrangler deploy` ghi đè giá trị trên
# Dashboard bằng dòng này. hoangluxury.vercel.app là bản test trên Vercel (24/11/2026).
FORMS_ALLOWED_ORIGINS = "https://hoangluxury.travel,https://www.hoangluxury.travel,https://hoangluxury.vercel.app"
